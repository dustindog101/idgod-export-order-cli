[project]
name = "idgod-order-cli"
version = "0.1.0"
description = "CLI to submit ID orders to idgod.ph from CSV/XLSX/JSON exports"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "playwright>=1.40.0",
    "httpx[socks]>=0.27.0",
    "torpy>=1.1.6",
]

[project.optional-dependencies]
captcha = ["ppllocr>=2.2", "ddddocr", "Pillow>=10.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: hits network or system tor (slow)",
]

[project.scripts]
idgod-order = "idgod_order_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["idgod_order_cli*"]
